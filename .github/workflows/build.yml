name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # paper-api 26.3 requires a Java 25 toolchain to compile against, but Gradle 8.14.3
      # itself cannot run on a JDK 25 daemon. Install JDK 25 first (only its JAVA_HOME_25_X64
      # env var is used, for Gradle's toolchain auto-detection), then JDK 21 last so it becomes
      # JAVA_HOME and actually launches Gradle - mirrors the local dev setup.
      - name: Set up JDK 25 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (runs Gradle itself)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CrashRace
          path: build/libs/*.jar
          if-no-files-found: error
